<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tasks</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            background: #172554;
            color: white;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            color: #dbeafe;
        }

        .panel {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #0000000d;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th, td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background: #eff6ff;
            color: #172554;
        }

        select, button {
            padding: 9px;
            border-radius: 5px;
            border: 1px solid #cbd5e1;
        }

        button {
            background: #1d4ed8;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        .message {
            background: #fff7ed;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
            color: #9a3412;
        }

        .empty {
            padding: 24px;
            text-align: center;
            color: #64748b;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #1d4ed8;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1>My Assigned Tasks</h1>
        <p>View your tasks and update their status.</p>
    </div>

    <div th:if="${error}" class="message" th:text="${error}"></div>

    <div class="panel">
        <table>
            <thead>
            <tr>
                <th>Task</th>
                <th>Description</th>
                <th>Project</th>
                <th>Priority</th>
                <th>Deadline</th>
                <th>Status</th>
                <th>Update</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.title}">Task title</td>
                <td th:text="${task.description}">Description</td>
                <td>
                    <span th:if="${task.project != null}"
                          th:text="${task.project.name}">Project</span>
                    <span th:if="${task.project == null}">Not assigned</span>
                </td>
                <td th:text="${task.priority}">Medium</td>
                <td>
                    <span th:if="${task.deadline != null}"
                          th:text="${task.deadline}">Deadline</span>
                    <span th:if="${task.deadline == null}">Not set</span>
                </td>
                <td th:text="${task.status}">Pending</td>
                <td>
                    <form th:action="@{/employee/tasks/{id}/status(id=${task.id})}"
                          method="post">

                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}">

                        <select name="status" required>
                            <option value="Pending"
                                    th:selected="${task.status == 'Pending'}">
                                Pending
                            </option>
                            <option value="In Progress"
                                    th:selected="${task.status == 'In Progress'}">
                                In Progress
                            </option>
                            <option value="Completed"
                                    th:selected="${task.status == 'Completed'}">
                                Completed
                            </option>
                        </select>

                        <button type="submit">Save</button>
                    </form>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="7" class="empty">
                    No tasks have been assigned to your account yet.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <a class="back-link" th:href="@{/dashboard}">Back to Dashboard</a>

</div>
</body>
</html>
