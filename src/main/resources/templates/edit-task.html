<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Task</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fc; color: #26364b; }
        header { background: #183153; color: white; padding: 22px 5%; }
        nav { background: #102544; padding: 12px 5%; display: flex; gap: 12px; flex-wrap: wrap; }
        nav a, nav button { color: white; text-decoration: none; background: none; border: 0; padding: 9px; cursor: pointer; }
        main { max-width: 800px; margin: 28px auto; padding: 0 16px; }
        .panel { background: white; padding: 24px; border: 1px solid #e1e8f0; border-radius: 12px; }
        h2 { color: #183153; margin-top: 0; }
        label { display: block; margin: 15px 0 7px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 11px; border: 1px solid #ccd6e3; border-radius: 7px; font: inherit; background: white; }
        textarea { min-height: 90px; }
        button.primary { margin-top: 20px; background: #183153; color: white; border: 0; padding: 12px 18px; border-radius: 7px; cursor: pointer; }
        .notice { background: #eff6ff; padding: 12px; border-radius: 7px; margin: 12px 0; }
        .back { display: inline-block; margin-top: 18px; color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
<header><h2>Project Task Management System</h2></header>
<nav>
    <a th:href="@{/manager/dashboard}">Dashboard</a>
    <a th:href="@{/projects}">Projects</a>
    <a th:href="@{/teams}">Create Team</a>
    <a th:href="@{/tasks}">Tasks</a>
    <a th:href="@{/team}">Team Members</a>
    <form th:action="@{/logout}" method="post" style="margin:0">
        <button type="submit">Logout</button>
    </form>
</nav>

<main>
    <section class="panel">
        <h2>Edit Task</h2>

        <div class="notice">
            Task assignment is restricted to the team currently assigned to this project.
        </div>

        <form th:action="@{/tasks/update}" method="post">
            <input type="hidden" name="id" th:value="${task.id}">
            <input type="hidden" name="projectId"
                   th:value="${task.project != null ? task.project.id : ''}">

            <label>Project</label>
            <input type="text"
                   th:value="${task.project != null ? task.project.name : 'No project'}"
                   readonly>

            <label for="title">Task Title</label>
            <input id="title" name="title" required
                   th:value="${task.title}">

            <label for="description">Description</label>
            <textarea id="description" name="description"
                      th:text="${task.description}"></textarea>

            <label for="teamMemberId">Assigned Employee</label>
            <select id="teamMemberId" name="teamMemberId" required
                    th:disabled="${#lists.isEmpty(teamMembers)}">
                <option value="">-- Select employee --</option>
                <option th:each="member : ${teamMembers}"
                        th:value="${member.id}"
                        th:selected="${task.teamMember != null and task.teamMember.id == member.id}"
                        th:text="${member.name + ' — ' + member.email}">
                </option>
            </select>

            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="Pending" th:selected="${task.status == 'Pending'}">Pending</option>
                <option value="In Progress" th:selected="${task.status == 'In Progress'}">In Progress</option>
                <option value="Completed" th:selected="${task.status == 'Completed'}">Completed</option>
            </select>

            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                <option value="Low" th:selected="${task.priority == 'Low'}">Low</option>
                <option value="Medium" th:selected="${task.priority == 'Medium'}">Medium</option>
                <option value="High" th:selected="${task.priority == 'High'}">High</option>
                <option value="Urgent" th:selected="${task.priority == 'Urgent'}">Urgent</option>
            </select>

            <label for="deadline">Deadline</label>
            <input id="deadline" name="deadline" type="date"
                   th:value="${task.deadline}">

            <button class="primary" type="submit"
                    th:disabled="${#lists.isEmpty(teamMembers)}">
                Save Changes
            </button>
        </form>

        <p th:if="${#lists.isEmpty(teamMembers)}">
            This project has no eligible team members. Assign a team to the project first.
        </p>

        <a class="back" th:href="@{/tasks}">← Back to Tasks</a>
    </section>
</main>
</body>
</html>
