<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Project Task Management System</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #222; }
        nav { background: #243447; padding: 15px 24px; display: flex; gap: 20px; flex-wrap: wrap; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        .container { max-width: 1200px; margin: 28px auto; padding: 0 16px; }
        .panel { background: white; padding: 22px; border-radius: 8px; margin-bottom: 24px; box-shadow: 0 2px 8px #00000012; }
        h1, h2 { margin-top: 0; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 7px; }
        .full { grid-column: 1 / -1; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccd2d8; border-radius: 5px; font-size: 14px; }
        textarea { min-height: 85px; resize: vertical; }
        button, .action { background: #1769aa; color: white; border: 0; border-radius: 5px; padding: 10px 15px; cursor: pointer; text-decoration: none; display: inline-block; }
        button:disabled { background: #999; cursor: not-allowed; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 850px; }
        th, td { text-align: left; padding: 11px; border-bottom: 1px solid #e4e7eb; }
        th { background: #eef2f6; }
        .delete { background: #bd3030; }
        @media (max-width: 650px) { .form-grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
    </style>
</head>
<body>

<nav>
    <a th:href="@{/manager/dashboard}">Dashboard</a>
    <a th:href="@{/projects}">Projects</a>
    <a th:href="@{/tasks}">Tasks</a>
    <a th:href="@{/team}">Team Members</a>
    <a th:href="@{/teams}">Create Team</a>
    <a th:href="@{/logout}">Logout</a>
</nav>

<div class="container">
    <h1>Task Management</h1>

    <section class="panel">
        <h2>Create Task</h2>

        <form th:action="@{/tasks/save}" method="post">
            <div class="form-grid">

                <div class="form-group full">
                    <label for="title">Task Title</label>
                    <input id="title" name="title" type="text" required>
                </div>

                <div class="form-group full">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>

                <div class="form-group">
                    <label for="projectPicker">Project</label>
                    <select id="projectPicker" name="projectId" required>
                        <option value="">Select Project</option>
                        <option th:each="project : ${projects}"
                                th:value="${project.id}"
                                th:text="${project.name}"
                                th:selected="${selectedProjectId != null and selectedProjectId == project.id}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="teamMemberId">Assigned Team Member</label>
                    <select id="teamMemberId" name="teamMemberId" required>
                        <option value="">Select Team Member</option>
                        <option th:each="member : ${teamMembers}"
                                th:value="${member.id}"
                                th:text="${member.name + ' (' + member.email + ')'}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="taskRole">Role for This Task</label>
                    <input id="taskRole" name="taskRole" type="text"
                           placeholder="e.g. Developer, Tester, Designer" required>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="deadline">Deadline</label>
                    <input id="deadline" name="deadline" type="date">
                </div>

                <div class="form-group full">
                    <button id="submitTask" type="submit">Create Task</button>
                </div>
            </div>
        </form>
    </section>

    <section class="panel">
        <h2>Tasks</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Task</th>
                    <th>Project</th>
                    <th>Employee</th>
                    <th>Email</th>
                    <th>Task Role</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Deadline</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="task : ${tasks}">
                    <td th:text="${task.id}"></td>
                    <td th:text="${task.title}"></td>
                    <td th:text="${task.project != null ? task.project.name : ''}"></td>
                    <td th:text="${task.teamMember != null ? task.teamMember.name : ''}"></td>
                    <td th:text="${task.teamMember != null ? task.teamMember.email : ''}"></td>
                    <td th:text="${task.taskRole}"></td>
                    <td th:text="${task.status}"></td>
                    <td th:text="${task.priority}"></td>
                    <td th:text="${task.deadline != null ? task.deadline : ''}"></td>
                    <td>
                        <a class="action" th:href="@{/tasks/edit/{id}(id=${task.id})}">Edit</a>
                        <a class="action delete"
                           th:href="@{/tasks/delete/{id}(id=${task.id})}"
                           onclick="return confirm('Delete this task?')">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="10">No tasks found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</div>

<script>
    document.getElementById('projectPicker').addEventListener('change', function () {
        const projectId = this.value;
        const url = new URL(window.location.href);
        if (projectId) {
            url.searchParams.set('projectId', projectId);
        } else {
            url.searchParams.delete('projectId');
        }
        window.location.href = url.pathname + url.search;
    });
</script>

</body>
</html>
