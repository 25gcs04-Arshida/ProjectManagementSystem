<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | Project Task Management System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; color: #222; }
        nav { background: #243447; padding: 15px 24px; display: flex; gap: 20px; flex-wrap: wrap; }
        nav a { color: white; text-decoration: none; font-weight: bold; }
        .container { max-width: 760px; margin: 30px auto; padding: 0 16px; }
        .panel { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px #00000012; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 7px; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccd2d8; border-radius: 5px; }
        textarea { min-height: 90px; }
        button, .action { display: inline-block; background: #1769aa; color: white; padding: 10px 15px; border: 0; border-radius: 5px; text-decoration: none; cursor: pointer; }
        .action { background: #555; }
    </style>
</head>
<body>
<nav>
    <a th:href="@{/manager/dashboard}">Dashboard</a>
    <a th:href="@{/projects}">Projects</a>
    <a th:href="@{/tasks}">Tasks</a>
    <a th:href="@{/team}">Team Members</a>
    <a th:href="@{/teams}">Create Team</a>
    <a th:href="@{/logout}">Logout</a>
</nav>

<div class="container">
    <div class="panel">
        <h1>Edit Task</h1>

        <form th:action="@{/tasks/update}" method="post">
            <input type="hidden" name="id" th:value="${task.id}">

            <div class="form-group">
                <label for="title">Task Title</label>
                <input id="title" name="title" type="text"
                       th:value="${task.title}" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description"
                          th:text="${task.description}"></textarea>
            </div>

            <div class="form-group">
                <label>Project</label>
                <input type="text" th:value="${task.project.name}" readonly>
                <input type="hidden" name="projectId" th:value="${task.project.id}">
            </div>

            <div class="form-group">
                <label for="teamMemberId">Assigned Team Member</label>
                <select id="teamMemberId" name="teamMemberId" required>
                    <option th:each="member : ${teamMembers}"
                            th:value="${member.id}"
                            th:text="${member.name + ' (' + member.email + ')'}"
                            th:selected="${task.teamMember != null and task.teamMember.id == member.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="taskRole">Role for This Task</label>
                <input id="taskRole" name="taskRole" type="text"
                       th:value="${task.taskRole}"
                       placeholder="e.g. Developer, Tester, Designer" required>
            </div>

            <div class="form-group">
                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="Pending" th:selected="${task.status == 'Pending'}">Pending</option>
                    <option value="In Progress" th:selected="${task.status == 'In Progress'}">In Progress</option>
                    <option value="Completed" th:selected="${task.status == 'Completed'}">Completed</option>
                </select>
            </div>

            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority" required>
                    <option value="Low" th:selected="${task.priority == 'Low'}">Low</option>
                    <option value="Medium" th:selected="${task.priority == 'Medium'}">Medium</option>
                    <option value="High" th:selected="${task.priority == 'High'}">High</option>
                </select>
            </div>

            <div class="form-group">
                <label for="deadline">Deadline</label>
                <input id="deadline" name="deadline" type="date"
                       th:value="${task.deadline}">
            </div>

            <button type="submit">Save Changes</button>
            <a class="action" th:href="@{/tasks}">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
