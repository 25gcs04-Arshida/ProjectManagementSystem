<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task | Project Task Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #263449;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #142b4b, #24568d);
            color: white;
            padding: 20px 5%;
            box-shadow: 0 4px 15px rgba(20, 43, 75, 0.15);
        }

        .navbar h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
        }

        .container {
            width: calc(100% - 32px);
            max-width: 720px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(24, 49, 83, 0.08);
            border: 1px solid #e8edf5;
        }

        .back-link {
            display: inline-block;
            color: #24568d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 22px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .heading {
            margin-bottom: 28px;
        }

        .heading h2 {
            color: #183153;
            margin: 0 0 10px;
            font-size: 28px;
        }

        .heading p {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;
        }

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #263449;
            font-size: 14px;
            font-weight: 700;
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            padding: 13px 14px;
            font-family: inherit;
            font-size: 14px;
            color: #263449;
            background: #fff;
            border: 1px solid #d7dfeb;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #356fc0;
            box-shadow: 0 0 0 3px rgba(53, 111, 192, 0.12);
        }

        input[type="date"] {
            min-height: 45px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        select {
            cursor: pointer;
        }

        .form-note {
            color: #718096;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 7px;
        }

        .form-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid #e8edf5;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 12px 21px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .button-primary {
            color: white;
            background: linear-gradient(135deg, #24568d, #356fc0);
            box-shadow: 0 4px 10px rgba(36, 86, 141, 0.15);
        }

        .button-primary:hover {
            background: #183f70;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(36, 86, 141, 0.22);
        }

        .button-secondary {
            color: #34445c;
            background: #edf1f7;
        }

        .button-secondary:hover {
            background: #e0e7f1;
        }

        .footer {
            padding: 22px 15px;
            text-align: center;
            color: #718096;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 18px 20px;
            }

            .navbar h1 {
                font-size: 18px;
                line-height: 1.5;
            }

            .container {
                margin: 24px auto;
                padding: 23px 19px;
                border-radius: 12px;
            }

            .heading h2 {
                font-size: 24px;
            }

            .form-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="navbar">
    <h1>Project Task Management System</h1>
</header>

<main class="container">

    <a th:href="@{/tasks}" class="back-link">&larr; Back to Tasks</a>

    <div class="heading">
        <h2>Edit Task</h2>
        <p>Update task details, project assignment, priority, status, and deadline.</p>
    </div>

    <form th:action="@{/tasks/update}" method="post">

        <input type="hidden" name="id" th:value="${task.id}">

        <div class="form-group">
            <label for="projectId">Project</label>
            <select id="projectId" name="projectId" required>
                <option value="">Select Project</option>
                <option
                        th:each="project : ${projects}"
                        th:value="${project.id}"
                        th:text="${project.name}"
                        th:selected="${task.project != null and project.id == task.project.id}">
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">Task Title</label>
            <input
                    type="text"
                    id="title"
                    name="title"
                    th:value="${task.title}"
                    placeholder="Enter task title"
                    required>
        </div>

        <div class="form-group">
            <label for="description">Task Description</label>
            <textarea
                    id="description"
                    name="description"
                    th:text="${task.description}"
                    placeholder="Describe the task and its requirements"></textarea>
        </div>

        <div class="form-group">
            <label for="status">Task Status</label>
            <select id="status" name="status" required>
                <option value="Not Started"
                        th:selected="${task.status == 'Not Started'}">
                    Not Started
                </option>
                <option value="In Progress"
                        th:selected="${task.status == 'In Progress'}">
                    In Progress
                </option>
                <option value="Completed"
                        th:selected="${task.status == 'Completed'}">
                    Completed
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="priority">Task Priority</label>
            <select id="priority" name="priority" required>
                <option value="Low"
                        th:selected="${task.priority == 'Low'}">
                    Low
                </option>
                <option value="Medium"
                        th:selected="${task.priority == 'Medium'}">
                    Medium
                </option>
                <option value="High"
                        th:selected="${task.priority == 'High'}">
                    High
                </option>
            </select>
        </div>

        <div class="form-group">
            <label for="teamMemberId">Assign Team Member</label>
            <select id="teamMemberId" name="teamMemberId">
                <option value="">-- Unassigned --</option>
                <option
                        th:each="member : ${teamMembers}"
                        th:value="${member.id}"
                        th:text="${member.name}"
                        th:selected="${task.teamMember != null and task.teamMember.id == member.id}">
                </option>
            </select>
            <div class="form-note">
                Select a team member responsible for this task, or leave it unassigned.
            </div>
        </div>

        <div class="form-group">
            <label for="deadline">Task Deadline</label>
            <input
                    type="date"
                    id="deadline"
                    name="deadline"
                    th:value="${task.deadline}">
        </div>

        <div class="form-actions">
            <button type="submit" class="button button-primary">
                Update Task
            </button>
            <a th:href="@{/tasks}" class="button button-secondary">
                Cancel
            </a>
        </div>

    </form>

</main>

<footer class="footer">
    Project Task Management System
</footer>

</body>
</html>
