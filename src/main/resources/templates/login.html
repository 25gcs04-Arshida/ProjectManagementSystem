<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Project Task Management System</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5fa;
            display: grid;
            place-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            width: min(360px, calc(100% - 64px));
            box-shadow: 0 5px 25px #18315318;
        }
        h1 { color: #183153; font-size: 24px; }
        p { color: #68778b; }
        label { display: block; margin-top: 16px; }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd5e0;
            border-radius: 6px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            border: 0;
            border-radius: 6px;
            color: white;
            background: #183153;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #183153; }
        .message { color: #b42318; }
        .success { color: #18794e; }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome Back</h1>
    <p>Sign in to your project workspace.</p>

    <p class="message" th:if="${param.error}">
        Invalid username or password.
    </p>

    <p class="success" th:if="${param.registered}">
        Admin account created. You can now sign in.
    </p>

    <p class="message" th:if="${param.registrationClosed}">
        Admin registration is closed because an admin already exists.
    </p>

    <p class="success" th:if="${param.logout}">
        You have logged out successfully.
    </p>

    <form th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username"
               type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password"
               type="password" autocomplete="current-password" required>

        <button type="submit">Login</button>
    </form>

    <p style="margin-top:20px;">
        First-time admin?
        <a th:href="@{/register-admin}">Register here</a>
    </p>
</div>
</body>
</html>
