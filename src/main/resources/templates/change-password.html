<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Project Task Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f6fc;
            color: #26364b;
        }

        header {
            padding: 22px 5%;
            color: white;
            background: linear-gradient(120deg, #102544, #234a7b);
        }

        header h2 {
            margin: 0;
            font-size: 23px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 10px 5%;
            background: #18365e;
        }

        nav a {
            padding: 10px 14px;
            color: #edf4ff;
            text-decoration: none;
            border-radius: 7px;
            font-size: 14px;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .container {
            width: calc(100% - 30px);
            max-width: 520px;
            margin: 45px auto;
        }

        .card {
            padding: 30px;
            background: white;
            border: 1px solid #e3eaf3;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(24, 49, 83, 0.08);
        }

        h1 {
            margin: 0 0 10px;
            color: #183153;
            font-size: 25px;
        }

        .description {
            margin-bottom: 25px;
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            color: #26364b;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .hint {
            margin-top: 8px;
            color: #718096;
            font-size: 12px;
        }

        .message {
            padding: 12px 14px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        .error {
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .success {
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            color: white;
            background: #183153;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #28558b;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #2563eb;
            text-align: center;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            header h2 {
                font-size: 19px;
            }

            nav {
                padding: 9px 12px;
            }

            nav a {
                padding: 9px;
                font-size: 13px;
            }

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 23px 18px;
            }
        }
    </style>
    ```

</head>

<body>

<header>
    <h2>Project Task Management System</h2>
</header>

<nav>
    <a th:href="@{/dashboard}">Dashboard</a>
</nav>

<main class="container">
    <section class="card">

        <h1>Change Password</h1>

        <p class="description">
            Update your account password. Enter your current password
            before choosing a new one.
        </p>

        <div th:if="${errorMessage}"
             class="message error"
             th:text="${errorMessage}"
             role="alert"></div>

        <div th:if="${successMessage}"
             class="message success"
             th:text="${successMessage}"
             role="status"></div>

        <form th:action="@{/change-password}"
              method="post"
              autocomplete="off">

            <label for="currentPassword">Current Password</label>
            <input type="password"
                   id="currentPassword"
                   name="currentPassword"
                   autocomplete="current-password"
                   required>

            <label for="newPassword">New Password</label>
            <input type="password"
                   id="newPassword"
                   name="newPassword"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <p class="hint">Use at least 8 characters for your new password.</p>

            <label for="confirmPassword">Confirm New Password</label>
            <input type="password"
                   id="confirmPassword"
                   name="confirmPassword"
                   minlength="8"
                   autocomplete="new-password"
                   required>

            <button type="submit">Update Password</button>
        </form>

        <a class="back" th:href="@{/dashboard}">Back to Dashboard</a>

    </section>

</main>

</body>
</html>
