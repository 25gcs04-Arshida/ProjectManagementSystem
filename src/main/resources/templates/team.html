<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Team Members</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
        }

        .navbar {
            background-color: #172554;
            color: white;
            padding: 18px 35px;
        }

        .navbar h1 {
            margin: 0;
        }

        .container {
            padding: 30px;
        }

        .box {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
        }

        h2 {
            color: #172554;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background-color: #172554;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #172554;
            color: white;
        }

        .navbar {
            background-color: #172554;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="navbar">

    <h1>Project Task Management System</h1>

    <div class="nav-links">

        <a href="/">Dashboard</a>
        <a href="/projects">Projects</a>
        <a href="/tasks">Tasks</a>
        <a href="/team">Team Members</a>

    </div>

</div>

<div class="container">


    <div class="box">

        <h2>Team Members</h2>

        <input type="text"
               id="memberSearch"
               placeholder="Search team members..."
               onkeyup="searchMembers()"
               style="width:100%; padding:12px; margin-bottom:15px; box-sizing:border-box;">

        <table id="memberTable">

            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="member : ${members}">

                <td th:text="${member.id}"></td>
                <td th:text="${member.name}"></td>
                <td th:text="${member.email}"></td>
                <td th:text="${member.role}"></td>
                <td>
                    <a th:href="@{'/team/edit/' + ${member.id}}">
                        Edit
                    </a>
                    |
                    <a th:href="@{'/team/delete/' + ${member.id}}"
                       onclick="return confirm('Are you sure you want to delete this team member?')">
                        Delete
                    </a>
                </td>

            </tr>
            </tbody>

        </table>

    </div>

</div>

<script>
    function searchMembers() {

        let input = document.getElementById("memberSearch");
        let filter = input.value.toLowerCase();

        let rows = document.querySelectorAll("#memberTable tbody tr");

        rows.forEach(function(row) {

            let name = row.cells[1].textContent.toLowerCase();

            if (name.includes(filter)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }

        });
    }
</script>

</body>
</html>
