<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #183153;
            --primary-dark: #102544;
            --primary-light: #28558b;
            --accent: #3b82f6;
            --background: #f3f6fc;
            --text: #26364b;
            --muted: #718096;
            --border: #e3eaf3;
            --white: #ffffff;
            --shadow: 0 8px 24px rgba(24, 49, 83, 0.07);
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(120deg, #102544, #234a7b);
            color: var(--white);
            padding: 25px 5%;
            box-shadow: 0 4px 18px rgba(16, 37, 68, 0.15);
        }

        header h2 {
            margin: 0;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        nav {
            background: #18365e;
            padding: 13px 5%;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a,
        nav button {
            display: inline-block;
            color: #edf4ff;
            text-decoration: none;
            background: transparent;
            border: 0;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 14px;
            border-radius: 7px;
            transition: background 0.25s ease, transform 0.25s ease;
        }

        nav a:hover,
        nav button:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        main {
            max-width: 1280px;
            margin: 35px auto;
            padding: 0 25px;
        }

        .panel {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            box-shadow: var(--shadow);
        }

        .panel h2 {
            color: var(--primary);
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 10px;
        }

        .panel > p {
            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
            margin: 0 0 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .form-grid > div {
            min-width: 0;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #344762;
            margin-bottom: 9px;
        }

        input,
        textarea,
        select {
            display: block;
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d3dce8;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text);
            background: #ffffff;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input,
        select {
            min-height: 44px;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .full {
            grid-column: 1 / -1;
        }

        button.primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(120deg, var(--primary), var(--primary-light));
            color: var(--white);
            border: none;
            border-radius: 8px;
            padding: 13px 23px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(24, 49, 83, 0.16);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 16px rgba(24, 49, 83, 0.2);
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            min-width: 900px;
            background: var(--white);
        }

        th,
        td {
            text-align: left;
            padding: 15px 14px;
            border-bottom: 1px solid #e9eef5;
            font-size: 13px;
            vertical-align: middle;
        }

        th {
            background: #edf3fb;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #f7faff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td strong {
            display: block;
            color: var(--primary);
            font-size: 14px;
            margin-bottom: 5px;
        }

        td div {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
            max-width: 230px;
            overflow-wrap: anywhere;
        }

        td a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.2s ease;
        }

        td a:hover {
            color: #153e83;
            text-decoration: underline;
        }

        td[colspan] {
            text-align: center;
            padding: 28px 16px;
            color: var(--muted);
            font-size: 14px;
        }

        @media (max-width: 800px) {
            header {
                padding: 22px 4%;
            }

            header h2 {
                font-size: 22px;
            }

            nav {
                padding: 12px 4%;
            }

            main {
                margin: 25px auto;
                padding: 0 18px;
            }

            .panel {
                padding: 23px 20px;
            }

            .form-grid {
                gap: 18px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            header h2 {
                font-size: 20px;
                line-height: 1.4;
            }

            nav {
                gap: 5px;
                padding: 10px 14px;
            }

            nav a,
            nav button {
                font-size: 13px;
                padding: 9px 10px;
            }

            main {
                margin: 20px auto;
                padding: 0 12px;
            }

            .panel {
                padding: 21px 16px;
                border-radius: 12px;
                margin-bottom: 20px;
            }

            .panel h2 {
                font-size: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 17px;
            }

            .full {
                grid-column: auto;
            }

            button.primary {
                width: 100%;
            }

            th,
            td {
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Project Task Management System</h2>
</header>

<nav>
    <a th:href="@{/manager/dashboard}">Dashboard</a>
    <a th:href="@{/projects}">Projects</a>
    <a th:href="@{/tasks}">Tasks</a>
    <a th:href="@{/team}">Team Members</a>
    <form th:action="@{/logout}" method="post" style="margin:0">
        <button type="submit">Logout</button>
    </form>
</nav>

<main>
    <section class="panel">
        <h2>Add Task</h2>
        <p>Choose a project and assign this task to a team member.</p>

        <form th:action="@{/tasks/save}" method="post">
            <div class="form-grid">
                <div>
                    <label for="title">Task Title</label>
                    <input id="title" name="title" required>
                </div>

                <div>
                    <label for="projectId">Project</label>
                    <select id="projectId" name="projectId" required>
                        <option value="">-- Select Project --</option>
                        <option th:each="p : ${projects}"
                                th:value="${p.id}"
                                th:text="${p.name}"
                                th:selected="${selectedProjectId != null and selectedProjectId == p.id}">
                        </option>
                    </select>
                </div>

                <div class="full">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>

                <div>
                    <label for="teamMemberId">Assign Task To</label>
                    <select id="teamMemberId" name="teamMemberId" required>
                        <option value="">-- Select Team Member --</option>
                        <option th:each="m : ${teamMembers}"
                                th:value="${m.id}"
                                th:text="${m.name}">
                        </option>
                    </select>
                </div>

                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div>
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority" required>
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>

                <div>
                    <label for="deadline">Deadline</label>
                    <input id="deadline" name="deadline" type="date">
                </div>

                <div class="full">
                    <button class="primary" type="submit">+ Add Task</button>
                </div>
            </div>
        </form>
    </section>

    <section class="panel">
        <h2>Tasks</h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Task</th>
                    <th>Project</th>
                    <th>Assigned To</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Deadline</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="t : ${tasks}">
                    <td th:text="${t.id}"></td>
                    <td>
                        <strong th:text="${t.title}"></strong>
                        <div th:text="${t.description}"></div>
                    </td>
                    <td th:text="${t.project != null ? t.project.name : 'Not selected'}"></td>
                    <td th:text="${t.teamMember != null ? t.teamMember.name : 'Not assigned'}"></td>
                    <td th:text="${t.status}"></td>
                    <td th:text="${t.priority}"></td>
                    <td th:text="${t.deadline != null ? t.deadline : 'Not set'}"></td>
                    <td>
                        <a th:href="@{/tasks/edit/{id}(id=${t.id})}">Edit</a>
                        |
                        <a th:href="@{/tasks/delete/{id}(id=${t.id})}"
                           onclick="return confirm('Delete this task?');">Delete</a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(tasks)}">
                    <td colspan="8">No tasks yet. Add a task using the form above.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

</body>
</html>
