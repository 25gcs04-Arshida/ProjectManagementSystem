<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --primary: #183153;
            --primary-dark: #102544;
            --primary-light: #28558b;
            --accent: #3b82f6;
            --background: #f3f6fc;
            --text: #26364b;
            --muted: #718096;
            --border: #e3eaf3;
            --white: #ffffff;
            --shadow: 0 8px 24px rgba(24, 49, 83, 0.07);
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--background);
            color: var(--text);
            margin: 0;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(120deg, #102544, #234a7b);
            color: var(--white);
            padding: 22px 5%;
            box-shadow: 0 4px 18px rgba(16, 37, 68, 0.15);
        }

        header h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        nav {
            background: #18365e;
            padding: 10px 5%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            flex-wrap: wrap;
        }

        nav a {
            color: #edf4ff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 15px;
            border-radius: 7px;
            transition: background 0.25s ease;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .container {
            max-width: 1250px;
            margin: 35px auto;
            padding: 0 25px;
        }

        .box {
            background: var(--white);
            padding: 30px;
            margin-bottom: 28px;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: var(--shadow);
        }

        .page-title {
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 25px;
            padding-left: 13px;
            border-left: 4px solid var(--accent);
        }

        #memberSearch {
            display: block;
            width: 100%;
            padding: 14px 16px;
            margin: 0 0 24px;
            border: 1px solid #d3dce8;
            border-radius: 9px;
            background: #fbfdff;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        #memberSearch:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
            background: var(--white);
        }

        #memberSearch::placeholder {
            color: #94a3b8;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: separate;
            border-spacing: 0;
            background: var(--white);
        }

        th,
        td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #e9eef5;
            font-size: 14px;
        }

        th {
            background: #edf3fb;
            color: var(--primary);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        tbody tr {
            transition: background 0.2s ease;
        }

        tbody tr:hover {
            background: #f5f9ff;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        td {
            color: #475569;
            overflow-wrap: anywhere;
        }

        td:nth-child(2) {
            color: var(--primary);
            font-weight: 600;
        }

        td a {
            display: inline-block;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            margin: 2px 4px;
            transition: color 0.2s ease;
        }

        td a:hover {
            color: #153e83;
            text-decoration: underline;
        }

        .empty-message {
            padding: 25px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 800px) {
            header {
                padding: 20px 4%;
            }

            nav {
                padding: 10px 4%;
            }

            .container {
                margin: 25px auto;
                padding: 0 18px;
            }

            .box {
                padding: 24px 20px;
            }
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 20px;
            }

            header h2 {
                font-size: 20px;
                line-height: 1.4;
            }

            nav {
                padding: 9px 12px;
                gap: 4px;
            }

            nav a {
                font-size: 13px;
                padding: 9px 10px;
            }

            .container {
                margin: 20px auto;
                padding: 0 12px;
            }

            .box {
                padding: 21px 15px;
                border-radius: 12px;
            }

            .page-title {
                font-size: 21px;
            }

            #memberSearch {
                padding: 12px;
            }

            th,
            td {
                padding: 12px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Project Task Management System</h2>
</header>

<nav>
    <a th:href="@{/manager/dashboard}">Dashboard</a>
    <a th:href="@{/projects}">Projects</a>
    <a th:href="@{/tasks}">Tasks</a>
    <a th:href="@{/team}">Team Members</a>
</nav>

<div class="container">
    <div class="box">

        <h2 class="page-title">Team Members</h2>

        <input
                type="text"
                id="memberSearch"
                placeholder="Search team members..."
                onkeyup="searchMembers()">

        <div class="table-wrap">
            <table id="memberTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="member : ${members}">
                    <td th:text="${member.id}"></td>
                    <td th:text="${member.name}"></td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${member.role}"></td>
                    <td>
                        <a th:href="@{'/team/edit/' + ${member.id}}">Edit</a>
                        |
                        <a th:href="@{'/team/delete/' + ${member.id}}"
                           onclick="return confirm('Are you sure you want to delete this team member?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script>
    function searchMembers() {
        let input = document.getElementById("memberSearch");
        let filter = input.value.toLowerCase();
        let rows = document.querySelectorAll("#memberTable tbody tr");

        rows.forEach(function(row) {
            let name = row.cells[1].textContent.toLowerCase();

            if (name.includes(filter)) {
                row.style.display = "";
            } else {
                row.style.display = "none";
            }
        });
    }
</script>

</body>
</html>
