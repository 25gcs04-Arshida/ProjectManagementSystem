<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fb; color: #26344a; }
        header { background: #102544; color: white; padding: 20px 5%; }
        nav { background: #18365e; padding: 14px 5%; display: flex; gap: 22px; flex-wrap: wrap; }
        nav a, nav button { color: white; text-decoration: none; background: none; border: 0; cursor: pointer; }
        main { max-width: 1100px; margin: 28px auto; padding: 0 18px; }
        .panel { background: white; border-radius: 10px; padding: 22px; margin-bottom: 24px; box-shadow: 0 3px 12px #0000000d; }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 7px; }
        input, textarea, select { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        textarea { min-height: 80px; }
        .full { grid-column: 1 / -1; }
        button.primary { background: #174ea6; color: white; border: 0; border-radius: 6px; padding: 12px 18px; cursor: pointer; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; min-width: 650px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e5eaf1; }
        th { background: #edf2f9; }
        a { color: #174ea6; }
        @media(max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
    </style>
</head>
<body>
<header><h2>Project Task Management System</h2></header>

<nav>
    <a th:href="@{/projects}">Projects</a>
    <a th:href="@{/tasks}">Tasks</a>
    <a th:href="@{/team}">Team Members</a>
    <form th:action="@{/logout}" method="post" style="margin:0">
        <button type="submit">Logout</button>
    </form>
</nav>

<main>
    <section class="panel">
        <h2>Add Project</h2>
        <form th:action="@{/projects/save}" method="post">
            <div class="form-grid">
                <div>
                    <label for="name">Project Name</label>
                    <input id="name" name="name" required>
                </div>

                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="full">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>

                <div>
                    <label for="deadline">Deadline</label>
                    <input id="deadline" name="deadline" type="date">
                </div>

                <div class="full">
                    <button class="primary" type="submit">+ Add Project</button>
                </div>
            </div>
        </form>
    </section>

    <section class="panel">
        <h2>Projects</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Project</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Deadline</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${projects}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.description}"></td>
                    <td th:text="${p.status}"></td>
                    <td th:text="${p.deadline != null ? p.deadline : 'Not set'}"></td>
                    <td>
                        <a th:href="@{/tasks(projectId=${p.id})}">View / Add Tasks</a>
                        |
                        <a th:href="@{/projects/delete/{id}(id=${p.id})}"
                           onclick="return confirm('Delete this project?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(projects)}">
                    <td colspan="6">No projects have been added yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
