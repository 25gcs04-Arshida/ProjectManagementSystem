<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Team Member | Project Task Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #263449;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, #142b4b, #24568d);
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(20, 43, 75, 0.15);
        }

        .navbar h2 {
            margin: 0;
            font-size: 21px;
            line-height: 1.5;
        }

        .navbar-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 6px;
            font-size: 14px;
            transition: background 0.2s ease;
        }

        .navbar a:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .container {
            width: calc(100% - 32px);
            max-width: 650px;
            margin: 40px auto;
        }

        .back-link {
            display: inline-block;
            color: #24568d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(24, 49, 83, 0.08);
            border: 1px solid #e8edf5;
        }

        .form-heading {
            margin-bottom: 30px;
        }

        .form-heading h1 {
            color: #183153;
            margin: 0 0 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #718096;
            margin: 0;
            font-size: 14px;
            line-height: 1.7;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #263449;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d7dfeb;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            color: #263449;
            background: white;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input:focus {
            border-color: #356fc0;
            box-shadow: 0 0 0 3px rgba(53, 111, 192, 0.12);
        }

        input::placeholder {
            color: #a0aec0;
        }

        .form-note {
            margin-top: 7px;
            color: #718096;
            font-size: 12px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 30px;
            padding-top: 23px;
            border-top: 1px solid #e8edf5;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            min-height: 45px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            flex: 1;
            transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-update {
            color: white;
            background: linear-gradient(135deg, #24568d, #356fc0);
            box-shadow: 0 4px 10px rgba(36, 86, 141, 0.15);
        }

        .btn-update:hover {
            background: #183f70;
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(36, 86, 141, 0.22);
        }

        .btn-cancel {
            color: #34445c;
            background: #edf1f7;
        }

        .btn-cancel:hover {
            background: #e0e7f1;
        }

        .footer {
            padding: 22px 15px;
            text-align: center;
            color: #718096;
            font-size: 13px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 17px 20px;
                align-items: flex-start;
            }

            .navbar h2 {
                font-size: 18px;
            }

            .navbar-links {
                gap: 4px;
            }

            .navbar a {
                padding: 8px;
                font-size: 13px;
            }

            .container {
                margin: 25px auto;
            }

            .form-card {
                padding: 24px 20px;
                border-radius: 12px;
            }

            .form-heading h1 {
                font-size: 24px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">
    <h2>Project Task Management System</h2>

    <div class="navbar-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/projects}">Projects</a>
        <a th:href="@{/tasks}">Tasks</a>
        <a th:href="@{/team}">Team</a>
    </div>
</nav>

<main class="container">

    <a th:href="@{/team}" class="back-link">&larr; Back to Team</a>

    <section class="form-card">

        <div class="form-heading">
            <h1>Edit Team Member</h1>
            <p class="subtitle">
                Update the team member's personal details and role using the form below.
            </p>
        </div>

        <form th:action="@{/team/update}"
              th:object="${teamMember}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                        type="text"
                        id="name"
                        th:field="*{name}"
                        placeholder="Enter full name"
                        autocomplete="name"
                        required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="Enter email address"
                        autocomplete="email"
                        required>
            </div>

            <div class="form-group">
                <label for="role">Role</label>
                <input
                        type="text"
                        id="role"
                        th:field="*{role}"
                        placeholder="Enter team role"
                        required>
                <p class="form-note">
                    Enter the team member's role in the project.
                </p>
            </div>

            <div class="buttons">
                <button type="submit" class="btn btn-update">
                    Update Member
                </button>

                <a th:href="@{/team}" class="btn btn-cancel">
                    Cancel
                </a>
            </div>

        </form>

    </section>

</main>

<footer class="footer">
    Project Task Management System
</footer>

</body>
</html>
