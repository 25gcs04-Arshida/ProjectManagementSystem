<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f3f6fc; color: #26364b; }
        header { background: #183153; color: white; padding: 22px 5%; }
        nav { background: #102544; padding: 12px 5%; display: flex; gap: 12px; flex-wrap: wrap; }
        nav a, nav button { color: white; text-decoration: none; background: none; border: 0; padding: 9px; cursor: pointer; }
        main { max-width: 1200px; margin: 28px auto; padding: 0 16px; }
        .panel { background: white; padding: 24px; border: 1px solid #e1e8f0; border-radius: 12px; margin-bottom: 24px; }
        h2 { color: #183153; margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; }
        .full { grid-column: 1 / -1; }
        label { display: block; margin: 12px 0 7px; font-weight: 600; }
        input, textarea, select { width: 100%; padding: 11px; border: 1px solid #ccd6e3; border-radius: 7px; font: inherit; background: white; }
        textarea { min-height: 90px; }
        button.primary { background: #183153; color: white; border: 0; padding: 12px 18px; border-radius: 7px; cursor: pointer; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; min-width: 850px; border-collapse: collapse; }
        th, td { text-align: left; padding: 13px; border-bottom: 1px solid #e5eaf1; font-size: 14px; }
        th { background: #edf3fb; color: #183153; }
        td a { color: #2563eb; text-decoration: none; margin-right: 7px; }
        .empty { text-align: center; color: #64748b; }
        @media(max-width:650px) { .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } .panel { padding: 17px; } }
    </style>
</head>
<body>
<header><h2>Project Task Management System</h2></header>
<nav>
    <a th:href="@{/manager/dashboard}">Dashboard</a>
    <a th:href="@{/teams}">Create Team</a>
    <a th:href="@{/projects}">Projects</a>
    <a th:href="@{/tasks}">Tasks</a>
    <a th:href="@{/team}">Team Members</a>
    <form th:action="@{/logout}" method="post" style="margin:0">
        <button type="submit">Logout</button>
    </form>
</nav>

<main>
    <section class="panel">
        <h2>Add Project</h2>
        <form th:action="@{/projects/save}" method="post">
            <div class="grid">
                <div>
                    <label for="name">Project Name</label>
                    <input id="name" name="name" required maxlength="255">
                </div>
                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <div class="full">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>
                <div>
                    <label for="deadline">Deadline</label>
                    <input id="deadline" name="deadline" type="date">
                </div>
                <div>
                    <label for="teamId">Assign Team</label>
                    <select id="teamId" name="teamId">
                        <option value="">-- Select a team --</option>
                        <option th:each="team : ${teams}"
                                th:value="${team.id}"
                                th:text="${team.name}"></option>
                    </select>
                    <small th:if="${#lists.isEmpty(teams)}">
                        Create a team first using Create Team.
                    </small>
                </div>
                <div class="full">
                    <button class="primary" type="submit">Add Project</button>
                </div>
            </div>
        </form>
    </section>

    <section class="panel">
        <h2>Projects</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Project</th>
                    <th>Description</th>
                    <th>Assigned Team</th>
                    <th>Status</th>
                    <th>Deadline</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${projects}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.name}"></td>
                    <td th:text="${p.description != null ? p.description : '-'}"></td>
                    <td th:text="${p.team != null ? p.team.name : 'No team assigned'}"></td>
                    <td th:text="${p.status}"></td>
                    <td th:text="${p.deadline != null ? p.deadline : 'Not set'}"></td>
                    <td>
                        <a th:href="@{/tasks(projectId=${p.id})}">View / Add Tasks</a>
                        <a th:href="@{/projects/delete/{id}(id=${p.id})}"
                           onclick="return confirm('Delete this project?');">Delete</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(projects)}">
                    <td colspan="7" class="empty">No projects have been added yet.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
