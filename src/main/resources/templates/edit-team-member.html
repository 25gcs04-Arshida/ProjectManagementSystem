<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Team Member | Project Task Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f3f6fc;
            color: #26364b;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(120deg, #102544, #234a7b);
            color: white;
            padding: 25px 5%;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        nav {
            background: #18365e;
            padding: 12px 5%;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a,
        nav button {
            color: #edf4ff;
            text-decoration: none;
            background: transparent;
            border: 0;
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 7px;
        }

        nav a:hover,
        nav button:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        nav form {
            margin: 0;
        }

        main {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .panel {
            background: white;
            border: 1px solid #e3eaf3;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(24, 49, 83, 0.07);
        }

        h2 {
            color: #183153;
            font-size: 23px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 25px;
        }

        .form-group {
            margin-bottom: 21px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #344762;
        }

        input,
        select {
            width: 100%;
            min-height: 45px;
            padding: 12px 14px;
            border: 1px solid #d3dce8;
            border-radius: 8px;
            background: white;
            color: #26364b;
            font-family: inherit;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 28px;
        }

        .button {
            display: inline-block;
            text-align: center;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            padding: 13px 21px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .save-button {
            background: linear-gradient(120deg, #183153, #28558b);
            color: white;
        }

        .cancel-button {
            background: #e9eef5;
            color: #26364b;
        }

        .button:hover {
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            header {
                padding: 21px;
            }

            header h1 {
                font-size: 21px;
            }

            nav {
                padding: 10px;
                gap: 4px;
            }

            nav a,
            nav button {
                font-size: 13px;
                padding: 9px 10px;
            }

            main {
                margin: 22px auto;
                padding: 0 12px;
            }

            .panel {
                padding: 23px 18px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Project Task Management System</h1>
</header>

<nav>
    <a th:href="@{/manager/dashboard}">Dashboard</a>
    <a th:href="@{/projects}">Projects</a>
    <a th:href="@{/tasks}">Tasks</a>
    <a th:href="@{/team}">Team Members</a>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</nav>

<main>
    <section class="panel">

        <h2>Edit Team Member</h2>

        <p class="subtitle">
            Update the team member's name, email address and job designation.
        </p>

        <form th:action="@{/team/update}"
              th:object="${teamMember}"
              method="post">

            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Enter full name"
                       required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="Enter email address"
                       required>
            </div>

            <div class="form-group">
                <label for="role">Job Designation</label>

                <select id="role" th:field="*{role}" required>
                    <option value="">-- Select Designation --</option>

                    <option value="Developer">Developer</option>
                    <option value="Frontend Developer">Frontend Developer</option>
                    <option value="Backend Developer">Backend Developer</option>
                    <option value="Full Stack Developer">Full Stack Developer</option>
                    <option value="Tester">Tester</option>
                    <option value="UI/UX Designer">UI/UX Designer</option>
                    <option value="Business Analyst">Business Analyst</option>
                    <option value="Team Lead">Team Lead</option>
                    <option value="DevOps Engineer">DevOps Engineer</option>
                    <option value="Project Analyst">Project Analyst</option>
                    <option value="Other">Other</option>

                    <option th:if="${teamMember.role == 'EMPLOYEE'}"
                            value="EMPLOYEE">
                        EMPLOYEE (existing designation)
                    </option>

                    <option th:if="${teamMember.role == 'MANAGER'}"
                            value="MANAGER">
                        MANAGER (existing designation)
                    </option>
                </select>
            </div>

            <div class="actions">
                <button type="submit" class="button save-button">
                    Save Changes
                </button>

                <a th:href="@{/team}" class="button cancel-button">
                    Cancel
                </a>
            </div>

        </form>

    </section>
</main>

</body>
</html>
